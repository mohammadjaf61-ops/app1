# Hypermarket Platform - Local Development Environment
# Usage: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hypermarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hypermarket
      POSTGRES_PASSWORD: hypermarket_dev_password
      POSTGRES_DB: hypermarket_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hypermarket -d hypermarket_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache + Queue)
  redis:
    image: redis:7-alpine
    container_name: hypermarket-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch (Search Engine)
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: hypermarket-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: hypermarket_meili_master_key_dev
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - '7700:7700'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: hypermarket-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: hypermarket
      MINIO_ROOT_PASSWORD: hypermarket_minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'  # API
      - '9001:9001'  # Console
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: hypermarket-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 hypermarket hypermarket_minio_password;
      mc mb --ignore-existing myminio/hypermarket;
      mc anonymous set public myminio/hypermarket/public;
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: hypermarket-network
